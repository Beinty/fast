name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # the release step writes a tag and an asset; without this the token is read-only
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find project root and build
        id: build
        # the Gemini key is never in the repo; it is injected here from the secret
        # and ends up only inside the built APK
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          SETTINGS=$(find . -name 'settings.gradle.kts' -not -path '*/build/*' | head -1)
          if [ -z "$SETTINGS" ]; then
            echo "ما لكيت settings.gradle.kts — هذي محتويات المستودع:"
            find . -maxdepth 3 -not -path './.git/*'
            exit 1
          fi
          ROOT=$(dirname "$SETTINGS")
          echo "::notice::جذر المشروع: $ROOT"
          cd "$ROOT"
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee /tmp/build.log

      - name: Publish errors to summary
        if: failure()
        run: |
          # annotations survive where the raw log download does not
          grep -E "^e: " /tmp/build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done || true
          # annotations are the only part of a failed build we can read back, so the
          # lines that actually name the cause have to come through them
          grep -E -A 8 "What went wrong" /tmp/build.log | head -24 \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          grep -E "Could not (find|resolve|determine)|No matching variant|Unresolved reference|Caused by" \
            /tmp/build.log | head -20 \
            | while IFS= read -r line; do echo "::error::$line"; done || true
          echo '## أخطاء الترجمة' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(e|w): |error:|Caused by|FAILURE:|\* What went wrong|Unresolved|Expecting" /tmp/build.log \
            | head -120 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo '### آخر ٦٠ سطر' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -60 /tmp/build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FastType-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
          if-no-files-found: error

      - name: Upload launcher APK
        uses: actions/upload-artifact@v4
        with:
          name: Glass-launcher-apk
          path: '**/glass/build/outputs/apk/debug/glass-debug.apk'
          if-no-files-found: error

      # An Actions artifact is a zip behind a login, which is no use on a phone.
      # A release asset is a plain file on a URL that never changes, so the same
      # two links always point at the newest build.
      - name: Publish to the fixed download links
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KB=$(find . -path '*app/build/outputs/apk/debug/app-debug.apk' | head -1)
          GL=$(find . -path '*glass/build/outputs/apk/debug/glass-debug.apk' | head -1)
          VER=$(grep -m1 'versionName' FastType/app/build.gradle.kts \
                | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p out
          cp "$KB" "out/FastType.apk"
          cp "$GL" "out/Glass.apk"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest out/FastType.apk out/Glass.apk \
            --title "أحدث نسخة — $VER" \
            --notes "كتابة سريعة $VER · بُنيت من ${GITHUB_SHA:0:7}" \
            --latest
